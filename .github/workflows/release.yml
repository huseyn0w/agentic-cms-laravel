name: Release

# Build a prebuilt core release and publish it to a GitHub Release.
#
# Triggered by pushing a version tag (e.g. v1.2.0). The job installs prod
# dependencies, builds the front-end (client + SSR), then runs
# `php artisan cms:build-release`, which packages ONLY the core-owned paths
# (per config/cms.php + PathManifest) into a tar.gz with a manifest, a sha256,
# and — when CMS_RELEASE_SIGN_KEY is set — an Ed25519 signature. The in-admin
# updater on each fleet site consumes these assets.
#
# The signing secret (base64 sodium secret key) lives in the repo secret
# CMS_RELEASE_SIGN_KEY. Its public half is what each site puts in
# config('cms.update.public_key') (CMS_UPDATE_PUBLIC_KEY).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish core release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imagick, pdo_sqlite, mbstring, intl, gd, sodium
          tools: composer:v2

      - name: Install Composer dependencies (prod)
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build front-end (client + SSR)
        run: npm ci && npm run build

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release package
        env:
          CMS_RELEASE_SIGN_KEY: ${{ secrets.CMS_RELEASE_SIGN_KEY }}
        run: php artisan cms:build-release "${{ steps.version.outputs.version }}" --output=build-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-release/release-*.tar.gz
            build-release/release-*.tar.gz.sha256
            build-release/release-*.tar.gz.sig
            build-release/release-manifest.json

      # Update the flat releases.json feed that each fleet site's update channel
      # reads. Lives on an orphan `releases` branch; the step bootstraps it on
      # the first release so no manual setup is needed.
      - name: Publish release feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          SERVER="${{ github.server_url }}"
          FEED_DIR="$RUNNER_TEMP/feed"
          AUTH="https://x-access-token:${GITHUB_TOKEN}@${SERVER#https://}/${REPO}.git"

          if git ls-remote --exit-code --heads "$AUTH" releases >/dev/null 2>&1; then
            git clone --depth 1 --branch releases "$AUTH" "$FEED_DIR"
          else
            echo "releases branch missing — bootstrapping it"
            git clone --depth 1 "$AUTH" "$FEED_DIR"
            git -C "$FEED_DIR" checkout --orphan releases
            git -C "$FEED_DIR" reset --hard
            git -C "$FEED_DIR" clean -fdx
            echo '{"releases":[]}' > "$FEED_DIR/releases.json"
          fi

          php artisan cms:build-feed "$VERSION" \
            --dir="$GITHUB_WORKSPACE/build-release" \
            --repo-url="$SERVER/$REPO" \
            --feed="$FEED_DIR/releases.json"

          cd "$FEED_DIR"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git commit -m "chore(feed): publish release $VERSION" || { echo "feed unchanged"; exit 0; }
          git push "$AUTH" HEAD:releases
